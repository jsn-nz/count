<!DOCTYPE html>
<!-- Source for images/og.png (the 1200x630 social share image). Rebuild with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=images/og.png tools/og.html
  Update the year badge each April. -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#111;background-image:radial-gradient(1100px 620px at 78% -10%,#1f3a29 0%,transparent 65%);
color:#F0F0F0;font-family:'Inter',system-ui,sans-serif;display:flex;padding:70px 80px;gap:60px;align-items:center;overflow:hidden}
.l{flex:1}.logo{font-size:64px;font-weight:800;color:#4E8C62;letter-spacing:-.03em}
h1{font-size:68px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:26px 0 22px}
p{font-size:28px;color:#B8B8B8;font-weight:500;line-height:1.35}
.badge{display:inline-block;margin-top:34px;border:2px solid #4E8C62;color:#7BC293;border-radius:999px;padding:10px 24px;font-size:24px;font-weight:700}
.card{width:380px;background:#1A1A1A;border:1px solid #303030;border-radius:24px;padding:34px 34px 28px;box-shadow:0 0 0 6px rgba(78,140,98,.18)}
.lab{font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#808080}
.big{font-size:58px;font-weight:800;color:#5FA877;letter-spacing:-.02em;margin:8px 0 22px}
.row{display:flex;justify-content:space-between;font-size:22px;padding:11px 0;border-top:1px solid #2a2a2a;color:#C4C4C4;font-weight:500}
.row span:last-child{color:#F0F0F0;font-weight:700}
</style></head><body>
<div class="l"><div class="logo">Count.</div><h1>NZ PAYE &amp; take-home pay calculator</h1>
<p>Income tax, ACC, KiwiSaver and student loan &mdash; worked out in seconds.</p><div class="badge">Updated for 2026&ndash;27</div></div>
<div class="card"><div class="lab">$70,000 salary</div><div class="big">$1,021<span style="font-size:26px;color:#808080"> / week</span></div>
<div class="row"><span>PAYE</span><span>$13,220</span></div><div class="row"><span>ACC levy</span><span>$1,225</span></div>
<div class="row"><span>KiwiSaver 3.5%</span><span>$2,450</span></div><div class="row"><span>Take-home</span><span>$53,105</span></div></div>
</body></html>
